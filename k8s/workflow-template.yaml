# WorkflowTemplate pipeline huấn luyện: acquire -> process -> train, chạy tuần tự.
# Tham số: run-id (bắt buộc), shift (mặc định 0), image (mặc định skelty-poc:0.1).
# Chạy tay:
#   argo submit -n argo --from workflowtemplate/skelty-training-pipeline -p run-id=baseline-001 --watch
# Orchestrator tạo Workflow tham chiếu template này với run-id = issue-<số issue>.
# Image phải có sẵn trên node (hoặc trong registry mà node kéo được); imagePullPolicy IfNotPresent.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: skelty-training-pipeline
  namespace: argo
spec:
  entrypoint: pipeline
  serviceAccountName: argo-workflow
  activeDeadlineSeconds: 1800
  arguments:
    parameters:
      - name: run-id
      - name: shift
        value: "0"
      - name: image
        value: skelty-poc:0.1
  volumes:
    - name: artifacts
      persistentVolumeClaim:
        claimName: skelty-artifacts
  templates:
    - name: pipeline
      steps:
        - - name: acquire
            template: step
            arguments:
              parameters: [{name: script, value: acquire.py}]
        - - name: process
            template: step
            arguments:
              parameters: [{name: script, value: process.py}]
        - - name: train
            template: step
            arguments:
              parameters: [{name: script, value: train.py}]
    - name: step
      inputs:
        parameters:
          - name: script
      container:
        image: "{{workflow.parameters.image}}"
        imagePullPolicy: IfNotPresent
        command: [python]
        args:
          - "/app/pipeline/{{inputs.parameters.script}}"
          - "--run-id"
          - "{{workflow.parameters.run-id}}"
          - "--shift"
          - "{{workflow.parameters.shift}}"
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
          - name: artifacts
            mountPath: /data
